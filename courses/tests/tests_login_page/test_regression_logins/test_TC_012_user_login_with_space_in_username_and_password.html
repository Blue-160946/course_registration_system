<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ล็อกอิน</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
      crossorigin="anonymous"
    />

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link href="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/css/select2.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/select2-bootstrap-5-theme@1.3.0/dist/select2-bootstrap-5-theme.min.css" />

    <style>
        :root {
            --bs-orange: #fd7e14;
            --bs-orange-dark: #e67e00;
        }
        
        .bg-orange {
            background-color: var(--bs-orange);
        }
        
        .bg-orange-gradient {
            background: linear-gradient(135deg, #fd7e14, #ff9500);
        }
        
        .btn-orange {
            background-color: var(--bs-orange);
            color: white;
            border: none;
        }
        
        .btn-orange:hover {
            background-color: var(--bs-orange-dark);
            color: white;
        }
        
        .text-orange {
            color: var(--bs-orange);
        }
        
        .navbar-brand {
            font-weight: 700;
            letter-spacing: 0.5px;
        }
        
        .nav-link {
            font-weight: 500;
            position: relative;
        }
        
        .nav-link:hover {
            color: var(--bs-orange) !important;
        }
        
        .nav-link.active {
            color: var(--bs-orange) !important;
            font-weight: 600;
        }
        
        .nav-link.active::after {
            content: '';
            position: absolute;
            bottom: -1px;
            left: 0;
            right: 0;
            height: 2px;
            background-color: var(--bs-orange);
            border-radius: 2px;
        }
        
        body {
            background-color: #f8f9fa;
        }
        
        .container {
            padding-bottom: 3rem;
        }
        
        footer {
            background-color: #343a40;
            color: white;
            padding: 1.5rem 0;
            margin-top: 3rem;
        }
    </style>
</head>

<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4 shadow-sm">
        <div class="container">
            <a class="navbar-brand d-flex align-items-center" href="/">
                <i class="bi bi-journal-bookmark-fill me-2 text-orange"></i>
                <span>ระบบลงทะเบียน</span>
            </a>

            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                    <li class="nav-item">
                        <a class="nav-link active" aria-current="page" href="/">
                            <i class="bi bi-house-door me-1"></i>หน้าแรก
                        </a>
                        
                        
                    </li>
                </ul>

                <ul class="navbar-nav ms-auto mb-2 mb-lg-0">
                    
                        <li class="nav-item">
                            <a class="nav-link btn btn-orange px-3 py-2" href="/users/login/">
                                <i class="bi bi-box-arrow-in-right me-1"></i>ล็อกอิน
                            </a>
                        </li>
                    
                </ul>
            </div>
        </div>
    </nav>
  
    <main class="container">
        
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-lg-5 col-md-8">
            <div class="card shadow-sm border-0">
                <div class="card-header bg-orange-gradient text-white py-3">
                    <h2 class="mb-0 text-center"><i class="bi bi-person-badge me-2"></i>ล็อกอิน</h2>
                </div>
                
                <div class="card-body p-4">
                    
                    
                        
                            <div class="alert alert-danger d-flex align-items-center" role="alert">
                                <i class="bi bi-exclamation-triangle-fill me-2"></i>
                                <div>ชื่อผู้ใช้หรือรหัสผ่านไม่ถูกต้อง</div>
                            </div>
                        
                    

                    <form method="post" class="needs-validation" novalidate>
                        <input type="hidden" name="csrfmiddlewaretoken" value="CSRF_TOKEN">
                        
                        <div class="mb-3">
                            <label for="id_username" class="form-label">ชื่อผู้ใช้</label>
                            <input type="text" name="username" class="form-control" id="id_username" 
                                   placeholder="กรอกชื่อผู้ใช้" required>
                            <div class="invalid-feedback">กรุณากรอกชื่อผู้ใช้</div>
                        </div>
                        
                        <div class="mb-4">
                            <label for="id_password" class="form-label">รหัสผ่าน</label>
                            <input type="password" name="password" class="form-control" 
                                   id="id_password" placeholder="กรอกรหัสผ่าน" required>
                            <div class="invalid-feedback">กรุณากรอกรหัสผ่าน</div>
                        </div>
                        
                        <button type="submit" class="btn btn-orange btn-lg w-100 py-2">
                            <i class="bi bi-box-arrow-in-right me-2"></i>ล็อกอิน
                        </button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<style>
    .bg-orange-gradient {
        background: linear-gradient(to right, #fd7e14, #ff9500);
    }
    .btn-orange {
        background-color: #fd7e14;
        color: white;
        border: none;
    }
    .btn-orange:hover {
        background-color: #e67e00;
        color: white;
    }
    .text-orange {
        color: #fd7e14;
    }
</style>

<script>
    // Bootstrap validation script
    (function() {
        'use strict'
        const forms = document.querySelectorAll('.needs-validation')
        
        Array.from(forms).forEach(form => {
            form.addEventListener('submit', event => {
                if (!form.checkValidity()) {
                    event.preventDefault()
                    event.stopPropagation()
                }
                form.classList.add('was-validated')
            }, false)
        })
    })()
</script>

    </main>

    <footer class="footer mt-auto">
        <div class="container text-center">
            <p class="mb-0">&copy; ระบบลงทะเบียนเรียน - มหาวิทยาลัยตัวอย่าง</p>
        </div>
    </footer>

    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
      crossorigin="anonymous"
    ></script>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/js/select2.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery.formset/1.2.2/jquery.formset.js"></script>

    
</body>
</html>
