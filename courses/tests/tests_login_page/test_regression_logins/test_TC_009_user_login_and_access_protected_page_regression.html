<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>จัดการรายวิชา</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
      crossorigin="anonymous"
    />

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link href="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/css/select2.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/select2-bootstrap-5-theme@1.3.0/dist/select2-bootstrap-5-theme.min.css" />

    <style>
        :root {
            --bs-orange: #fd7e14;
            --bs-orange-dark: #e67e00;
        }
        
        .bg-orange {
            background-color: var(--bs-orange);
        }
        
        .bg-orange-gradient {
            background: linear-gradient(135deg, #fd7e14, #ff9500);
        }
        
        .btn-orange {
            background-color: var(--bs-orange);
            color: white;
            border: none;
        }
        
        .btn-orange:hover {
            background-color: var(--bs-orange-dark);
            color: white;
        }
        
        .text-orange {
            color: var(--bs-orange);
        }
        
        .navbar-brand {
            font-weight: 700;
            letter-spacing: 0.5px;
        }
        
        .nav-link {
            font-weight: 500;
            position: relative;
        }
        
        .nav-link:hover {
            color: var(--bs-orange) !important;
        }
        
        .nav-link.active {
            color: var(--bs-orange) !important;
            font-weight: 600;
        }
        
        .nav-link.active::after {
            content: '';
            position: absolute;
            bottom: -1px;
            left: 0;
            right: 0;
            height: 2px;
            background-color: var(--bs-orange);
            border-radius: 2px;
        }
        
        body {
            background-color: #f8f9fa;
        }
        
        .container {
            padding-bottom: 3rem;
        }
        
        footer {
            background-color: #343a40;
            color: white;
            padding: 1.5rem 0;
            margin-top: 3rem;
        }
    </style>
</head>

<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4 shadow-sm">
        <div class="container">
            <a class="navbar-brand d-flex align-items-center" href="/">
                <i class="bi bi-journal-bookmark-fill me-2 text-orange"></i>
                <span>ระบบลงทะเบียน</span>
            </a>

            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                    <li class="nav-item">
                        <a class="nav-link active" aria-current="page" href="/">
                            <i class="bi bi-house-door me-1"></i>หน้าแรก
                        </a>
                        
                            <li class="nav-item">
                                <a class="nav-link" href="/manage/courses/">
                                    <i class="bi bi-gear me-2"></i>จัดการรายวิชา
                                </a>
                            </li>
                            <li class="nav-item">
                                <a class="nav-link" href="/users/students/">
                                    <i class="bi bi-people me-2"></i>ดูข้อมูลนิสิต
                                </a>
                            </li>
                            <li class="nav-item">
                                <a class="nav-link" href="/manage/courses/master-data/">
                                    <i class="bi bi-database-gear me-2"></i>ข้อมูลตั้งต้น
                                </a>
                            </li>
                        
                        
                    </li>
                </ul>

                <ul class="navbar-nav ms-auto mb-2 mb-lg-0">
                    
                        <li class="nav-item dropdown">
                            <a class="nav-link dropdown-toggle d-flex align-items-center" href="#" role="button" data-bs-toggle="dropdown" aria-expanded="false">
                                <i class="bi bi-person-circle me-1"></i>
                                <span>สวัสดี, None เจ้าหน้าที่ ระบบ </span>
                            </a>
                            <ul class="dropdown-menu dropdown-menu-end">
                                <li>
                                    <form action="/users/logout/" method="post" class="d-inline">
                                        <input type="hidden" name="csrfmiddlewaretoken" value="CSRF_TOKEN">
                                        <button type="submit" class="dropdown-item">
                                            <i class="bi bi-box-arrow-right me-2"></i>ออกจากระบบ
                                        </button>
                                    </form>
                                </li>
                            </ul>
                        </li>
                    
                </ul>
            </div>
        </div>
    </nav>
  
    <main class="container">
        
<div class="container-fluid py-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h1 class="display-5 fw-bold text-orange">
            <i class="bi bi-book me-2"></i>จัดการรายวิชา
        </h1>
        <a href="/manage/courses/add/" class="btn btn-orange">
            <i class="bi bi-plus-circle me-1"></i>เพิ่มรายวิชาใหม่
        </a>
    </div>

    <div class="card shadow-sm border-0">
        <div class="card-body p-0">
            <div class="table-responsive">
                <table class="table table-hover mb-0">
                    <thead class="bg-light">
                        <tr>
                            <th class="ps-4">รหัสวิชา</th>
                            <th>ชื่อวิชา</th>
                            <th>คณะ</th>
                            <th>ภาควิชา</th>
                            <th>สถานะ</th>
                            <th class="text-end pe-4">จัดการ</th>
                        </tr>
                    </thead>
                    <tbody>
                        
                        <tr>
                            <td colspan="6" class="text-center py-4 text-muted">
                                <i class="bi bi-exclamation-circle fs-4 d-block mb-2"></i>
                                ยังไม่มีรายวิชาที่ลงทะเบียน
                            </td>
                        </tr>
                        
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    
    
</div>

    </main>

    <footer class="footer mt-auto">
        <div class="container text-center">
            <p class="mb-0">&copy; ระบบลงทะเบียนเรียน - มหาวิทยาลัยตัวอย่าง</p>
        </div>
    </footer>

    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
      crossorigin="anonymous"
    ></script>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/js/select2.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery.formset/1.2.2/jquery.formset.js"></script>

    
</body>
</html>
