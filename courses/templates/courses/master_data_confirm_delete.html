{% extends 'core/base.html' %}

{% block title %}ลบ{{ label }}{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-lg-6">
    <div class="card shadow-sm border-danger">
      <div class="card-body">
        <h1 class="h4">ยืนยันการลบ{{ label }}</h1>
        <p>ต้องการลบ “{{ object }}” หรือไม่?</p>
        <form method="post">
          {% csrf_token %}
          <button type="submit" class="btn btn-danger">ยืนยันการลบ</button>
          <a href="{% url 'courses:master-data-list' kind %}" class="btn btn-outline-secondary">ยกเลิก</a>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
