# pytest.ini
[pytest]
DJANGO_SETTINGS_MODULE = course_registration_system.settings
python_files = test_*.py *_test.py
addopts =
    -q
    --strict-markers
    --maxfail=1
    --disable-warnings
    --cov
    --cov-branch
    --cov-report=term-missing
markers =
    integration: integration tests
    slow: slow tests
    unit: unit tests

